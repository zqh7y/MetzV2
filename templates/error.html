{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="error-page">
    <div class="error-card">
        <div class="error-code">{{ code }}</div>
        <h1 class="error-title">{{ title }}</h1>
        <p class="error-message">{{ message }}</p>
        <a href="/" class="no-more-btn">← Back to Home</a>
    </div>
</div>
{% endblock %}
